name: Bersihin Flutter CI & Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze-test-and-build:
    name: Analyze, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code formatting & static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Build Release APK (Split per ABI)
        if: github.event_name == 'push'
        run: flutter build apk --release --split-per-abi

      - name: Upload Release APKs Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bersihin-pos-release-apks
          path: build/app/outputs/flutter-apk/*.apk
